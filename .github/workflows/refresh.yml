name: Refresh and publish

# Every morning at 10:00 UTC (5–6 AM US Eastern): grade finished games,
# update this week's picks, save the ledger back to the repo, and publish the site.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["web/**", "oracle/**", "config/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data
        env:
          TZ: America/New_York
        run: python -m oracle refresh

      - name: Run tests
        run: python -m oracle test

      - name: Save ledger and data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh data $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Build site
        run: |
          mkdir -p _site/data
          cp web/* _site/
          cp data/app.json data/ledger.json _site/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
